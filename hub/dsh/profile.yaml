name: dsh
description: DeepSeek Harness (dsh) headless profile as an AgentProc agent — a full tool-using agent runtime with streaming, sessions, and usage
cli: dsh
cli_install: |
  # Requires Node.js >= 22.18 / >= 24.2 (the launcher entry reads
  # import.meta.main) or Bun:
  #   npm install -g @deepseek-ai/dsh
  # Authenticate (either way works):
  #   export DEEPSEEK_API_KEY=...
  # or store it once via the web UI — headless reads stored credentials too:
  #   dsh --profile web        # Models page writes the key, then exit
agentproc:
  command: node
  args: ["{{PROFILE_DIR}}/bridge.js"]
  # Runs via the bundled bridge.js/bridge.py (not the built-in `dsh`
  # executor, which is plain/stateless). The bridge feature-detects
  # `--json` / `--session-id` from `dsh --profile headless --help`.
  # cwd is intentionally left unset. `agentproc hub run` defaults it to your
  # current directory, so the agent works on whatever project you are in.
  timeout_secs: 1800        # headless runs a full agent turn (tools, bash);
                            # give it room — override per-run if needed
  streaming: true           # bridge streams --json text frames as partial
                            # events when the dsh build supports --json
                            # (commit-point granularity, not per-token);
                            # older builds fall back to a single final event
  env:
    DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
    # Unattended posture is bridge-enforced: the bridge defaults
    # DSH_PERMISSION_MODE to danger-full-access when unset (same convention as
    # the claude-code profile's --dangerously-skip-permissions default).
    # Set DSH_PERMISSION_MODE here to override (workspace-write / read-only).
    # Set AGENTPROC_AUTO_APPROVE=0 in the bridge's own environment (via the CLI
    # `--env` flag, or by uncommenting the pass-through below *with* the
    # matching env_allowlist entry) and the bridge injects no default at all,
    # leaving dsh's own "ask" policy in place.
    # AGENTPROC_AUTO_APPROVE: "${AGENTPROC_AUTO_APPROVE}"
    DSH_PERMISSION_MODE: "${DSH_PERMISSION_MODE}"
    DSH_TOOLS_MODE: "${DSH_TOOLS_MODE}"
  env_allowlist: [DEEPSEEK_API_KEY, DSH_PERMISSION_MODE, DSH_TOOLS_MODE]
tested: community
maintainer: kong
tags: [coding, ai, deepseek, agent, harness]
notes: |
  Runs via the bundled bridge (bridge.js on Node, bridge.py on Python), which
  invokes `dsh --profile headless --json "<task>"` (the DeepSeek Harness one-shot
  bundle: coding persona, bash/fs/search tools, sandbox, persisted session
  log). Verified end-to-end against dsh 0.1.7-rc.2.

  Feature-detected via `dsh --profile headless --help`: builds advertising
  `--json` (>= 0.1.6-alpha.1) stream partials from committed text frames and
  report usage; builds also advertising `--session-id` (>= 0.1.6-alpha.1)
  stamp session_id from the opening frame and resume the persisted Session on
  later turns (true multi-turn for IM/email bridges; session resume requires
  the `--session-id` capability and a stable bridge cwd). Older builds fall
  back to plain one-shot text and stay stateless on the wire.

  Session adoption is strict upstream: the Session must exist, run in the
  same cwd, and not belong to a subagent/fork or an agent preset — mismatches
  surface as error events. Keep the bridge cwd stable for continuity.

  Usage: dsh reports token counts in disjoint buckets; the bridge folds
  cacheRead/cacheWrite into the inclusive `input_tokens` agentproc expects
  and maps the rest 1:1 (output/total/cache/reasoning).

  No mid-turn tool authorization: dsh headless has no stdio approval channel,
  so `permission: true` is not supported — the SDK executor hard-fails, and
  this bridge injects no approval argv. The bridge defaults
  DSH_PERMISSION_MODE=danger-full-access for unattended runs (auto-approve);
  override to workspace-write / read-only to lean on the sandbox instead, or
  set AGENTPROC_AUTO_APPROVE=0 in the bridge's own environment to suppress the
  injected default entirely (dsh's own "ask" policy then applies).

  Attachments are appended to the task text as reference URLs — dsh's web
  tool may fetch public URLs; local file paths are not readable this way.

  Tool authorization posture, in one line:
    DSH_PERMISSION_MODE=danger-full-access   auto-approve everything (default)
    DSH_PERMISSION_MODE=workspace-write      sandboxed writes, "ask" policy —
                                             an ask with no UI may stall or
                                             deny; prefer read-only for strict
                                             unattended runs
    DSH_PERMISSION_MODE=read-only            strictest unattended mode
